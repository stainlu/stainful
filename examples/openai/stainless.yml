organization:
  name: openai

# Representative slice — exercises every capability stainful v0.2+ supports:
# streaming, JSON body, multipart upload, binary download, cursor pagination,
# nested subresources. Not the full openai surface; expand iteratively.

resources:
  chat:
    subresources:
      completions:
        methods:
          create:
            endpoint: "post /chat/completions"
            streaming:
              type: sse
              stream_event_model: CreateChatCompletionStreamResponse
              param_discriminator: stream
          retrieve:
            endpoint: "get /chat/completions/{completion_id}"
          update:
            endpoint: "post /chat/completions/{completion_id}"
          list:
            endpoint: "get /chat/completions"
            paginated: true
          delete:
            endpoint: "delete /chat/completions/{completion_id}"
        subresources:
          messages:
            methods:
              list:
                endpoint: "get /chat/completions/{completion_id}/messages"
                paginated: true

  embeddings:                    # simple POST JSON → JSON
    methods:
      create:
        endpoint: "post /embeddings"

  files:                         # multipart upload + list + retrieve + delete + content
    methods:
      create:
        endpoint: "post /files"
      list:
        endpoint: "get /files"
        paginated: true
      retrieve:
        endpoint: "get /files/{file_id}"
      delete:
        endpoint: "delete /files/{file_id}"
      content:
        endpoint: "get /files/{file_id}/content"

  audio:                         # speech (binary out) + transcriptions (multipart in + streaming)
    subresources:
      speech:
        methods:
          create:
            endpoint: "post /audio/speech"
      transcriptions:
        methods:
          create:
            endpoint: "post /audio/transcriptions"
            streaming:
              type: sse
              stream_event_model: CreateTranscriptionResponseStreamEvent
              param_discriminator: stream

  fine_tuning:                   # nested subresources w/ pagination
    subresources:
      jobs:
        methods:
          create:
            endpoint: "post /fine_tuning/jobs"
          list:
            endpoint: "get /fine_tuning/jobs"
            paginated: true
          retrieve:
            endpoint: "get /fine_tuning/jobs/{fine_tuning_job_id}"
          cancel:
            endpoint: "post /fine_tuning/jobs/{fine_tuning_job_id}/cancel"
          pause:
            endpoint: "post /fine_tuning/jobs/{fine_tuning_job_id}/pause"
          resume:
            endpoint: "post /fine_tuning/jobs/{fine_tuning_job_id}/resume"
        subresources:
          checkpoints:
            methods:
              list:
                endpoint: "get /fine_tuning/jobs/{fine_tuning_job_id}/checkpoints"
                paginated: true
          events:
            methods:
              list:
                endpoint: "get /fine_tuning/jobs/{fine_tuning_job_id}/events"
                paginated: true

  models:                        # simple list/retrieve/delete (no pagination in openai)
    methods:
      list:
        endpoint: "get /models"
      retrieve:
        endpoint: "get /models/{model}"
      delete:
        endpoint: "delete /models/{model}"

pagination:
  # OpenAI/Stainless `SyncCursorPage` — `?after=<last_id>`, response has
  # `data`, `has_more`, items each have `id`. (See
  # tests/oracles/openai-python/.../pagination.py:SyncCursorPage.)
  - name: cursor_page
    type: cursor
    request:
      after: { type: string }
      limit: { type: integer }
    response:
      data: { type: array }
      has_more: { type: boolean }

targets:
  python:
    package_name: openai

environments:
  production: https://api.openai.com/v1
